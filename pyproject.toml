[project]
name = "projectionlab-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25",
    "playwright>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
projectionlab-mcp = "projectionlab_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
